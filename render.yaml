services:
  - type: web
    name: format-studio-api
    runtime: python
    rootDir: .
    branch: main
    autoDeploy: true
    buildCommand: apt-get update && apt-get install -y ffmpeg curl unzip && curl -fsSL https://deno.land/install.sh | DENO_INSTALL="$PWD/.deno" sh -s -- -y && pip install -r requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11

  - type: web
    name: format-studio
    runtime: node
    rootDir: frontend
    branch: main
    autoDeploy: true
    buildCommand: npm install --include=dev && npx --no-install next build
    startCommand: npx next start -p $PORT
    healthCheckPath: /
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
